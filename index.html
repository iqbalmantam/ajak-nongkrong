<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F6F5FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15133A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ketemu teman baru di sekitarmu, bukan cuma chat.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nongkrong">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://erysagldjwrkcedtkqxj.supabase.co" crossorigin>
<title>Ajak Nongkrong</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FF;--card:#fff;--ink:#23205A;--mute:#66658A;--line:#E3E1F5;--acc:#FFB627;--acc-ink:#3A2A00;--mint:#17936F;--chip:#ECEAFB;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#15133A;--card:#201D52;--ink:#F1F0FF;--mute:#A9A7D4;--line:#312E6E;--chip:#2B2868;--mint:#4FD6A9;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:480px;margin:0 auto;padding:20px 18px calc(32px + env(safe-area-inset-bottom,0))}body.hasnav .app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0))}
h1{font-size:2rem;line-height:1.05;font-weight:800;margin:8px 0 10px}h2{font-size:1.4rem;font-weight:800;margin:0}
p{margin:0 0 14px;color:var(--mute)}label{font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;font-size:16px;min-height:48px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 12px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 20px;background:var(--ink);color:var(--bg);cursor:pointer;width:100%;min-height:48px;transition:transform .1s,opacity .2s}
.btn.acc{background:var(--acc);color:var(--acc-ink)}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.sm{width:auto;padding:9px 16px;border-radius:12px;min-height:44px}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{border:0;background:var(--chip);color:var(--ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"],.tag.m{background:var(--acc);color:var(--acc-ink)}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;margin:0 6px 6px 0}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:800}.meta{font-size:.85rem;color:var(--mute)}.ok{color:var(--mint);font-weight:600;font-size:.82rem}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav[hidden]{display:none}
.nav>div{display:flex;width:100%;max-width:480px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
.nav button{flex:1;position:relative;border:0;background:none;font:inherit;font-size:.72rem;font-weight:700;color:var(--mute);padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;cursor:pointer}
.nav button[aria-current="true"]{color:var(--ink)}
.ic{display:flex;padding:4px 18px;border-radius:999px;transition:background .15s}
.nav [aria-current="true"] .ic{background:var(--acc);color:var(--acc-ink)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:4px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:#E5484D;border:2px solid var(--card)}
.bg{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:rgba(10,8,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0));max-height:92%;overflow:auto;overscroll-behavior:contain;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet.chat{height:92%;display:flex;flex-direction:column;overflow:hidden}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px;touch-action:none;position:relative;flex:none}
.grab::before{content:"";position:absolute;inset:-14px -40px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0;min-height:140px;max-height:44vh;overflow:auto;overscroll-behavior:contain}
.sheet.chat .msgs{flex:1;max-height:none}
.b{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--chip);overflow-wrap:anywhere;white-space:pre-wrap}.b.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink)}
.b small{display:block;font-size:.68rem;opacity:.65;margin-top:2px;text-align:right}
.kb .hide-kb{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:90%;text-align:center;pointer-events:none;animation:fade .2s}
body.hasnav .toast{bottom:calc(92px + env(safe-area-inset-bottom,0))}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}.row{display:flex;gap:8px;align-items:center}
.ppl{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;flex:none}
.th{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:68px}
.th>div{flex:1;min-width:0}.th .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--mint)}
.sk{height:112px;border-radius:20px;margin-bottom:12px;border:1px solid var(--line);background:linear-gradient(90deg,var(--card) 25%,var(--chip) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
input.sw{-webkit-appearance:none;appearance:none;width:52px;height:30px;min-height:0;border-radius:999px;background:var(--line);border:0;padding:0;margin:0;position:relative;flex:none;transition:background .2s;cursor:pointer}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
input.sw:checked{background:var(--mint)}input.sw:checked::after{transform:translateX(22px)}
textarea{resize:none;min-height:84px}
.btn:active:not(:disabled),.chip:active,.nav button:active,.th:active{transform:scale(.97)}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div><div id="layer"></div>
<nav class="nav" id="nav" hidden aria-label="Navigasi utama"><div>
<button data-a="tab" data-v="near"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>Terdekat</button>
<button data-a="tab" data-v="inv"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Ajakan</button>
<button data-a="tab" data-v="msg"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></span>Pesan</button>
<button data-a="tab" data-v="me"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Profil</button>
</div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const SB_URL=(window.SB_CFG||{}).url||"ISI_PROJECT_URL",SB_KEY=(window.SB_CFG||{}).key||"";
const IN=["Kopi","Board game","Futsal","Jalan sore","Kuliner","Film","Fotografi","Gowes","Musik","Baca buku"];
let sb;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){document.getElementById("app").innerHTML="<h1>Konfigurasi salah</h1><p>"+e.message+"</p><p>SB_URL harus berbentuk https://xxxx.supabase.co</p>"}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me,prof,tab="near",sel=[],mail="",chat=null,invs=[],rad=5,unread=0,lastSent=0,hid=0;
const chipsH=()=>IN.map(x=>`<button class="chip" aria-pressed="${sel.includes(x)}" data-a="chip" data-v="${x}">${x}</button>`).join("");
const ini=n=>esc(([...String(n||"?").trim()][0]||"?").toUpperCase());
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const view=(h,n)=>{$("#app").innerHTML=h;$("#nav").hidden=!n;document.body.classList.toggle("hasnav",!!n)};
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const bad=e=>{if(e){toast(e.message||"Terjadi kesalahan");return true}return false};
const vv=window.visualViewport;
function fitVV(){const b=$("#layer .bg");if(!b||!vv)return;b.style.setProperty("--vvh",vv.height+"px");b.style.transform=`translateY(${vv.offsetTop}px)`;b.classList.toggle("kb",vv.height<screen.height*.7)}
if(vv)["resize","scroll"].forEach(e=>vv.addEventListener(e,fitVV));
const sheet=(h,c="")=>{$("#layer").innerHTML=`<div class="bg" data-a="bg"><div class="sheet ${c}" role="dialog" aria-modal="true"><div class="grab" data-grab></div>${h}</div></div>`;document.body.style.overflow="hidden";fitVV()};
const closeS=()=>{$("#layer").innerHTML="";chat=null;document.body.style.overflow=""};
const tm=d=>new Date(d).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const fmt=d=>{const x=new Date(d),n=new Date(),k=Math.round((new Date(x.getFullYear(),x.getMonth(),x.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
 return(k===0?"Hari ini":k===1?"Besok":x.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"}))+", "+tm(d)};
function dot(){const b=$('#nav [data-v="msg"]');if(!b)return;let d=b.querySelector(".dot");if(unread&&tab!=="msg"){if(!d){d=document.createElement("i");d.className="dot";b.appendChild(d)}}else if(d)d.remove()}
async function autoLoc(){try{const p=await navigator.permissions.query({name:"geolocation"});if(p.state!=="granted")return;const c=await locate();await sb.rpc("set_location",{lat:c.latitude,lng:c.longitude})}catch(e){}}

function hashId(){return(location.hash.match(/^#ajakan-(\d+)$/)||[])[1]}
async function openLink(){
 let id=hashId();try{if(!id)id=localStorage.getItem("pend");localStorage.removeItem("pend")}catch(e){}
 if(!id)return;history.replaceState(null,"",location.pathname);
 const{data,error}=await sb.rpc("get_invite",{p_id:+id});if(bad(error))return;
 const v=(data||[])[0];if(!v)return toast("Ajakan tidak ditemukan atau sudah dihapus");
 if(!invs.find(x=>x.id===v.id))invs.push(v);
 const full=!v.joined&&v.cnt>=v.max_people;
 sheet(`<h2>${esc(v.title)}</h2><p class="meta">${esc(v.place)} · ${fmt(v.starts_at)}<br>Oleh ${esc(v.host_name)} · ${v.cnt} dari ${v.max_people} orang</p><p>Pertemuan pertama sebaiknya di tempat umum.</p>
 <button class="btn acc" data-a="${v.joined?"leave":"join"}" data-v="${v.id}" ${full?"disabled":""}>${v.joined?"Batal gabung":full?"Penuh":"Gabung"}</button>
 <div class="row" style="margin-top:10px"><button class="btn ghost" data-a="share" data-v="${v.id}">Bagikan</button><button class="btn ghost" data-a="bg">Tutup</button></div>`);
}
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return login(0);
 me=session.user;
 const{data,error}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
 if(bad(error))return;
 prof=data;if(!prof)return setup();
 sb.channel("m").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`receiver=eq.${me.id}`},p=>{
  if(chat&&chat.id===p.new.sender)addMsg(p.new.body,false,p.new.created_at);else{toast("Pesan baru masuk");unread=1;dot()}if(tab==="msg")go("msg")}).subscribe();
 await Promise.race([autoLoc(),wait(1500)]);
 await go(tab);openLink();
}
async function sendLink(){const{error}=await sb.auth.signInWithOtp({email:mail,options:{emailRedirectTo:location.origin+location.pathname}});if(bad(error))return false;lastSent=Date.now();return true}
function login(step){
 view(step?`<h1>Cek emailmu</h1><p>Tautan masuk dikirim ke ${esc(mail)}. Buka emailnya di perangkat ini, klik tautannya, dan kamu otomatis masuk. Cek folder spam bila belum ada.</p><button class="btn acc" data-a="resend">Kirim ulang tautan</button><div style="height:10px"></div><button class="btn ghost" data-a="back">Ganti email</button>`
 :`<h1>Ketemu teman baru, bukan cuma chat.</h1><p>Masuk lewat tautan yang kami kirim ke emailmu. Tanpa password.</p><label for="em">Email</label><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" value="${esc(mail)}"><button class="btn acc" data-a="otp">Kirim tautan masuk</button>`);
}
function setup(){
 view(`<h1>Kenalan dulu</h1><p>Lokasimu hanya dibagikan sebagai perkiraan ±500 m.</p><label for="nm">Nama panggilan</label><input id="nm" maxlength="30" autocomplete="given-name" autocapitalize="words" enterkeyhint="next">
 <label for="bio">Tentang kamu <span class="meta">(opsional)</span></label><textarea id="bio" maxlength="140" placeholder="Misal: suka kopi tenang dan obrolan santai"></textarea>
 <label>Minat (pilih minimal 2)</label><div class="chips">${chipsH()}</div>
 <button class="btn acc" data-a="save">Aktifkan lokasi dan mulai</button>`);
}
function locate(){return new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{timeout:10000}):no())}
async function pushLoc(){try{const c=await locate();return !bad((await sb.rpc("set_location",{lat:c.latitude,lng:c.longitude})).error)}catch(e){toast("Izinkan akses lokasi agar bisa menemukan orang terdekat");return false}}
async function go(t){
 tab=t;if(t==="msg")unread=0;dot();
 view(`<div id="body"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`,1);
 document.querySelectorAll("#nav button").forEach(x=>x.setAttribute("aria-current",x.dataset.v===t));
 const b=$("#body");
 if(t==="near"){
  const{data,error}=await sb.rpc("nearby",{radius_km:rad});if(bad(error))return;
  const L=(data||[]).map(p=>({...p,m:p.interests.filter(x=>prof.interests.includes(x)).length})).sort((a,c)=>c.m-a.m||a.km-c.km);
  b.innerHTML=`<div class="top" style="margin-bottom:6px"><h2>Sekitarmu</h2><button class="btn ghost sm" data-a="refresh">Muat ulang</button></div><div class="chips" role="group" aria-label="Radius pencarian">${[1,3,5,10].map(r=>`<button class="chip" aria-pressed="${r===rad}" data-a="rad" data-v="${r}">${r} km</button>`).join("")}</div>`+(L.length?L.map(p=>`<div class="card"><div class="ppl"><span class="av">${ini(p.name)}</span><div style="flex:1;min-width:0"><div class="name">${esc(p.name)}</div>${p.verified?'<span class="ok">Terverifikasi</span>':""}</div><span class="pill">± ${String(p.km).replace(".",",")} km</span></div>
  ${p.bio?`<p style="margin:10px 0 6px">${esc(p.bio)}</p>`:""}<div style="margin-top:10px">${p.interests.map(x=>`<span class="tag ${prof.interests.includes(x)?"m":""}">${esc(x)}</span>`).join("")}</div>
  <button class="btn acc" style="margin-top:4px" data-a="chat" data-v="${p.id}" data-n="${esc(p.name)}">${p.m?`Sapa · ${p.m} minat sama`:"Sapa"}</button></div>`).join(""):`<div class="empty">Belum ada orang di radius ${rad} km.<br>Coba perbesar radius atau perbarui lokasimu.</div><button class="btn ghost" data-a="loc">Perbarui lokasiku</button>`);
 }
 if(t==="inv"){
  const[{data,error},{data:mi}]=await Promise.all([sb.rpc("open_invites"),sb.from("invites").select("id").eq("host",me.id)]);if(bad(error))return;invs=data||[];const mine=new Set((mi||[]).map(x=>x.id));
  b.innerHTML=`<div class="top" style="margin-bottom:12px"><h2>Ajakan Cepat</h2><button class="btn acc sm" data-a="new">+ Buat</button></div>`+(invs.length?invs.map(v=>`<div class="card"><div class="top"><span class="name">${esc(v.title)}</span><span class="pill">${fmt(v.starts_at)}</span></div>
  <div class="meta" style="margin-top:4px">${esc(v.place)} · oleh ${esc(v.host_name)}</div>
  <div class="bar" role="img" aria-label="${v.cnt} dari ${v.max_people} orang"><i style="width:${Math.min(100,v.cnt/v.max_people*100)}%"></i></div><div class="meta">${v.cnt} dari ${v.max_people} orang</div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" style="flex:1" data-a="share" data-v="${v.id}">Bagikan</button><button class="btn ${v.joined?"ghost":"acc"} sm" style="flex:1" data-a="${v.joined?"leave":"join"}" data-v="${v.id}" ${!v.joined&&v.cnt>=v.max_people?"disabled":""}>${v.joined?"Batal gabung":v.cnt>=v.max_people?"Penuh":"Gabung"}</button></div>${mine.has(v.id)?`<button class="btn ghost sm" style="width:100%;margin-top:8px;color:#E5484D" data-a="del" data-v="${v.id}">Hapus ajakan</button>`:""}</div>`).join(""):`<div class="empty">Belum ada ajakan. Jadilah yang pertama.</div><button class="btn acc" data-a="new">Buat ajakan</button>`);
 }
 if(t==="msg"){
  const{data,error}=await sb.rpc("chat_threads");if(bad(error))return;
  b.innerHTML=`<h2 style="margin-bottom:12px">Pesan</h2>`+((data||[]).length?data.sort((a,c)=>new Date(c.last_at)-new Date(a.last_at)).map(t=>`<button class="card th" data-a="chat" data-v="${t.other}" data-n="${esc(t.name)}"><span class="av">${ini(t.name)}</span><div><div class="top"><span class="name">${esc(t.name)}</span><span class="meta">${fmt(t.last_at)}</span></div><div class="meta">${esc(t.last_body)}</div></div></button>`).join(""):`<div class="empty">Belum ada obrolan. Sapa seseorang di tab Terdekat.</div>`);
 }
 if(t==="me"){
  b.innerHTML=`<h2 style="margin-bottom:12px">Profil</h2><div class="card"><div class="ppl"><span class="av">${ini(prof.name)}</span><div><div class="name">${esc(prof.name)}</div>${prof.verified?'<span class="ok">Terverifikasi</span>':'<span class="meta">Belum terverifikasi</span>'}</div></div>${prof.bio?`<p style="margin:10px 0 0">${esc(prof.bio)}</p>`:""}<div style="margin:12px 0 6px">${prof.interests.map(x=>`<span class="tag m">${esc(x)}</span>`).join("")}</div><button class="btn ghost" data-a="edit">Ubah profil</button></div>
  <div class="card"><div class="top"><div><div class="name">Mode tidak terlihat</div><div class="meta">Sembunyikan dirimu dari pencarian</div></div><input type="checkbox" class="sw" id="gh" ${prof.ghost?"checked":""} aria-label="Mode tidak terlihat"></div></div>
  <button class="btn ghost" style="margin-bottom:10px" data-a="loc">Perbarui lokasiku</button><button class="btn ghost" data-a="out">Keluar</button>`;
  b.querySelector("#gh").onchange=async e=>{const{error}=await sb.from("profiles").update({ghost:e.target.checked}).eq("id",me.id);if(!bad(error))prof.ghost=e.target.checked}
 }
}
function addMsg(t,mine,at){const m=$("#ms");if(!m)return;const d=document.createElement("div");d.className="b"+(mine?" me":"");d.textContent=t;if(at){const s=document.createElement("small");s.textContent=tm(at);d.appendChild(s)}m.appendChild(d);m.scrollTop=m.scrollHeight}
function editSheet(){sel=[...prof.interests];
 sheet(`<h2>Ubah profil</h2><label for="nm">Nama panggilan</label><input id="nm" maxlength="30" value="${esc(prof.name)}" autocomplete="given-name" autocapitalize="words">
 <label for="bio">Tentang kamu</label><textarea id="bio" maxlength="140" placeholder="Misal: suka kopi tenang dan obrolan santai">${esc(prof.bio||"")}</textarea>
 <label>Minat (pilih minimal 2)</label><div class="chips">${chipsH()}</div><button class="btn acc" data-a="saveprof">Simpan</button>`);
}
async function openChat(id,name){
 chat={id,name};
 sheet(`<div class="top"><div class="ppl"><span class="av">${ini(name)}</span><div class="name">${esc(name)}</div></div><button class="btn ghost sm" data-a="bg">Tutup</button></div><p class="meta hide-kb" style="margin:8px 0 0">Bertemu pertama kali? Pilih tempat umum.</p>
 <div class="msgs" id="ms" aria-live="polite"></div><div class="row"><input id="ci" placeholder="Tulis pesan" maxlength="500" enterkeyhint="send" autocomplete="off" style="margin:0"><button class="btn acc sm" data-a="send" data-keep>Kirim</button></div>
 <div class="row hide-kb" style="justify-content:center;margin-top:10px"><button class="chip" data-a="block">Blokir</button><button class="chip" data-a="report">Laporkan</button></div>`,"chat");
 const{data,error}=await sb.from("messages").select("sender,body,created_at").or(`and(sender.eq.${me.id},receiver.eq.${id}),and(sender.eq.${id},receiver.eq.${me.id})`).order("created_at",{ascending:false}).limit(100);
 if(bad(error))return;data.reverse().forEach(m=>addMsg(m.body,m.sender===me.id,m.created_at));
 if(matchMedia("(pointer:fine)").matches){const i=$("#ci");if(i)i.focus()}
}
async function send(){const i=$("#ci"),t=i.value.trim();if(!t||!chat)return;i.value="";
 const{error}=await sb.from("messages").insert({receiver:chat.id,body:t});if(bad(error)){i.value=t;return}addMsg(t,true,new Date().toISOString());i.focus()}
function newSheet(){
 const d=new Date(Date.now()+36e5*3);d.setMinutes(0);const v=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 sheet(`<h2>Buat ajakan</h2><label for="t">Mau ngapain?</label><input id="t" maxlength="40"><label for="p">Di mana (tempat umum)</label><input id="p" maxlength="40">
 <label for="w">Waktu</label><input id="w" type="datetime-local" value="${v}"><label for="m">Jumlah orang</label><select id="m"><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
 <button class="btn acc" data-a="newok">Kirim ajakan</button>`);
}
const ACT={
 bg:(v,t)=>{if(t.classList.contains("bg")&&event.target!==t)return;closeS()},
 otp:async()=>{mail=$("#em").value.trim();const h=hashId();try{if(h)localStorage.setItem("pend",h)}catch(e){}if(!/^\S+@\S+\.\S+$/.test(mail))return toast("Isi email yang valid dulu");if(await sendLink())login(1)},
 resend:async()=>{const w=6e4-(Date.now()-lastSent);if(w>0)return toast("Tunggu "+Math.ceil(w/1e3)+" detik lagi");if(await sendLink())toast("Tautan dikirim ulang")},
 refresh:()=>{go(tab)},rad:v=>{rad=+v;go("near")},edit:editSheet,
 saveprof:async()=>{const n=$("#nm").value.trim(),bio=$("#bio").value.trim();if(n.length<2)return toast("Isi nama minimal 2 huruf");if(sel.length<2)return toast("Pilih minimal 2 minat");
  const{error}=await sb.from("profiles").update({name:n,bio,interests:sel}).eq("id",me.id);if(bad(error))return;
  Object.assign(prof,{name:n,bio,interests:[...sel]});closeS();toast("Profil disimpan");go("me")},
 back:()=>login(0),
 verify:async()=>{const{error}=await sb.auth.verifyOtp({email:mail,token:$("#cd").value.trim(),type:"email"});if(!bad(error))boot()},
 chip:(v,t)=>{const i=sel.indexOf(v);i<0?sel.push(v):sel.splice(i,1);t.setAttribute("aria-pressed",i<0)},
 save:async()=>{const n=$("#nm").value.trim();if(n.length<2)return toast("Isi nama minimal 2 huruf");if(sel.length<2)return toast("Pilih minimal 2 minat");
  const bio=$("#bio").value.trim(),row={id:me.id,name:n,interests:sel};if(bio)row.bio=bio;
  const{error}=await sb.from("profiles").insert(row);if(bad(error))return;
  await pushLoc();boot()},
 tab:v=>{go(v)},chat:(v,t)=>openChat(v,t.dataset.n),send,
 join:async v=>{const{error}=await sb.from("invite_members").insert({invite_id:+v});if(!bad(error)){closeS();go("inv")}},
 leave:async v=>{const{error}=await sb.from("invite_members").delete().eq("invite_id",+v).eq("user_id",me.id);if(!bad(error)){closeS();go("inv")}},
 new:newSheet,
 share:async v=>{const x=invs.find(i=>i.id==v);if(!x)return;const url=location.origin+location.pathname+"#ajakan-"+x.id;
  const text=`Ayo gabung: ${x.title} di ${x.place}, ${fmt(x.starts_at)}`;
  try{if(navigator.share){await navigator.share({title:x.title,text,url});return}}catch(e){if(e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(text+"\n"+url);toast("Link disalin, tempel di WhatsApp")}catch(e){prompt("Salin link ini:",url)}},
 del:async v=>{if(!confirm("Hapus ajakan ini? Peserta yang sudah gabung juga ikut terhapus."))return;const{data,error}=await sb.from("invites").delete().eq("id",+v).select("id");if(bad(error))return;if(!(data||[]).length)return toast("Ajakan ini tidak bisa dihapus");toast("Ajakan dihapus");go("inv")},
 newok:async()=>{const t=$("#t").value.trim(),p=$("#p").value.trim();if(t.length<2||p.length<2)return toast("Isi kegiatan dan tempat");
  const{error}=await sb.from("invites").insert({title:t,place:p,starts_at:new Date($("#w").value).toISOString(),max_people:+$("#m").value});if(!bad(error)){closeS();toast("Ajakan dibuat");go("inv")}},
 block:async()=>{const{error}=await sb.from("blocks").insert({blocked:chat.id});if(!bad(error)){closeS();toast("Pengguna diblokir");go(tab)}},
 report:async()=>{const{error}=await sb.from("reports").insert({reported:chat.id,reason:"dilaporkan dari chat"});if(!bad(error))toast("Laporan dikirim")},
 loc:async()=>{if(await pushLoc()){toast("Lokasi diperbarui");if(tab==="near")go("near")}},
 out:async()=>{await sb.auth.signOut();location.reload()}
};
addEventListener("hashchange",()=>{if(me&&hashId())openLink()});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||!ACT[t.dataset.a]||t.disabled)return;
 const r=ACT[t.dataset.a](t.dataset.v,t);if(r&&r.finally&&t.tagName==="BUTTON"){t.disabled=true;r.finally(()=>{t.disabled=false})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeS();if(e.key==="Enter"&&e.target.id==="ci")send();if(e.key==="Enter"&&e.target.id==="em")ACT.otp()});
document.addEventListener("pointerdown",e=>{if(e.target.closest("[data-keep]"))e.preventDefault()});
let gy=null;
document.addEventListener("touchstart",e=>{if(e.target.closest("[data-grab]"))gy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchmove",e=>{if(gy===null)return;const s=$("#layer .sheet");if(s){s.style.transition="none";s.style.transform=`translateY(${Math.max(0,e.touches[0].clientY-gy)}px)`}},{passive:true});
document.addEventListener("touchend",e=>{if(gy===null)return;const d=e.changedTouches[0].clientY-gy,s=$("#layer .sheet");gy=null;if(d>90)closeS();else if(s){s.style.transition="transform .2s";s.style.transform=""}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){hid=Date.now();return}if(me&&hid&&Date.now()-hid>6e4&&!chat&&!$("#layer").firstChild)Promise.race([autoLoc(),wait(1500)]).then(()=>go(tab))});
if(SB_URL.startsWith("ISI_"))view(`<h1>Belum dikonfigurasi</h1><p>Isi url dan key di file config.js. Langkah lengkap ada di README.md.</p>`);else if(sb)boot();
</script>
</body>
</html>
